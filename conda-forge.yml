conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
provider:
  osx_arm64: default
test: all
workflow_settings:
  build_workspace_dir:
  - os: win
    value: C:\bld
  free_disk_space: quick
  pagefile_size:
  - os: win
    value: 16
