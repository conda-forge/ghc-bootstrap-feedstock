c_stdlib:                       # [not osx]
  - sysroot                     # [linux]
  - m2w64-sysroot               # [not unix]
c_stdlib_version:               # [not osx]
  - 2.17                        # [linux and x86_64]
  - 2.28                        # [linux and aarch64]
  - 12                          # [not unix]

c_compiler:
  - clang                       # [unix]
  - gcc                         # [not unix]
c_compiler_version:
  - 18                          # [unix]
  - 15                          # [not unix]

cxx_compiler:
  - clangxx                     # [unix]
  - gxx                         # [not unix]
cxx_compiler_version:
  - 18                          # [unix]
  - 15                          # [not unix]
